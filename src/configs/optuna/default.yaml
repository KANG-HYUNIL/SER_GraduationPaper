enabled: false
study_name: "${experiment.family}_optuna"
namespace_by_search_space: true
storage: "sqlite:///optuna_studies/${experiment.family}_optuna.db"
direction: "maximize"
trials: 20  # Target number of COMPLETE trials; PRUNED/FAIL are not counted.
timeout: null
sampler_seed: 42
pruner:
  warmup_steps: 0
parallel_workers: 1
trials_per_worker: 10
metric: "f1_macro"
visualization:
  save_html: true
  save_png: false
  png_scale: 3
trial_overrides:
  train:
    folds_to_run: 1
search_space:
  chunking:
    enabled: true
    chunk_frames_choices: [48, 64, 80, 96]
    chunk_hop_ratio_choices: [0.25, 0.5]
    eval_hop_ratio_choices: [0.25, 0.5]
    aggregation_mode_choices: ["mean_logit", "confidence_weighted_logit", "topk_logit"]
    topk_ratio_choices: [0.25, 0.5, 0.75]
  transformer:
    patch_size_choices: [8, 16, 32]
    patch_stride_choices: [8, 16]
    embed_dim_choices: [128, 192, 256]
    num_layers_min: 2
    num_layers_max: 6
    num_heads_choices: [4, 8]
    ffn_ratio_choices: [2, 4]
    pooling_choices: ["attention", "mean", "cls"]
    dropout_min: 0.1
    dropout_max: 0.4
  cnn_conformer:
    stem_channel_choices: [32, 48, 64, 96]
    embed_dim_choices: [144, 192, 256]
    num_layers_choices: [4, 8, 12, 16]
    num_heads_choices: [4, 8]
    ffn_ratio_choices: [4]
    conv_kernel_choices: [15, 31]
    pooling_choices: ["attention", "mean"]
    dropout_min: 0.1
    dropout_max: 0.25
  hierarchical_window:
    stem_channel_choices: [32, 48, 64]
    stage1_dim_choices: [96, 128]
    stage2_dim_choices: [128, 160, 192]
    stage1_depth_min: 1
    stage1_depth_max: 3
    stage2_depth_min: 1
    stage2_depth_max: 3
    num_heads_choices: [4, 8]
    window_size_choices: [6, 8, 12]
    ffn_ratio_choices: [2, 3]
    pooling_choices: ["attention", "mean"]
    dropout_min: 0.1
    dropout_max: 0.4
  train:
    lr_min: 1.0e-4
    lr_max: 3.0e-3
    weight_decay_min: 1.0e-6
    weight_decay_max: 1.0e-3
    batch_choices: [16, 24, 32]
  logmel:
    n_mels_choices: [64, 80, 96, 128, 160]
    n_fft_choices: [512, 1024, 2048]
    hop_length_choices: [160, 256, 320]
    normalize_choices: [true, false]
    f_min_choices: [0.0, 20.0, 50.0]
    f_max_choices: [4000.0, 6000.0, 8000.0]
