enabled: false
study_name: "${experiment.family}_optuna_nostem_generalization"
namespace_by_search_space: true
storage: "sqlite:///optuna_studies/${experiment.family}_optuna_nostem_generalization.db"
direction: "maximize"
trials: 30
timeout: null
sampler_seed: 42
pruner:
  warmup_steps: 0
parallel_workers: 1
trials_per_worker: 10
metric: "f1_macro"
visualization:
  save_html: true
  save_png: false
  png_scale: 3
trial_overrides:
  train:
    folds_to_run: 1
    loss:
      name: "cross_entropy"
      label_smoothing: 0.0
      class_weight_mode: "none"
      focal_gamma: 2.0
    sampler:
      name: "random"
      class_weight_mode: "none"
  model:
    backbone_variant: "nostem_patch"
    num_heads: 8
    conv_kernel_size: 31
    conv_module_type: "single"
    pooling: "attention"
    layer_fusion: "last"
  data:
    n_mels: 80
    n_fft: 1024
    hop_length: 160
    normalize: true
    f_min: 0.0
    f_max: 6000.0
search_space:
  chunking:
    enabled: true
    chunk_frames_choices: [48]
    chunk_hop_ratio_choices: [0.25]
    eval_hop_ratio_choices: [0.25]
    aggregation_mode_choices: ["confidence_weighted_logit"]
    topk_ratio_choices: [0.75]
  cnn_conformer:
    backbone_variant_choices: ["nostem_patch"]
    stem_pair_choices:
      - [64, 96]
    subsampling_choices:
      - name: "time_preserve_first"
        stem_strides: [[2, 1], [2, 2]]
    nostem_patch_time_patch_choices: [2, 3, 4]
    sequence_shrinking_choices:
      - name: "none"
        enabled: false
        factor: 2
        at_layers: []
      - name: "late_2x"
        enabled: true
        factor: 2
        at_layers: [3]
      - name: "progressive_2x"
        enabled: true
        factor: 2
        at_layers: [2, 4]
    embed_dim_choices: [128, 160, 192]
    num_layers_choices: [3, 4]
    num_heads_choices: [8]
    ffn_ratio_choices: [3, 4]
    conv_kernel_choices: [31]
    layer_fusion_choices: ["last"]
    conv_module_type_choices: ["single"]
    loss_name_choices: ["cross_entropy"]
    sampler_name_choices: ["random"]
    class_weight_mode_choices: ["none"]
    focal_gamma_choices: [2.0]
    pooling_choices: ["attention"]
    stem_dropout_min: 0.08
    stem_dropout_max: 0.12
    projector_dropout_min: 0.08
    projector_dropout_max: 0.12
    input_dropout_min: 0.08
    input_dropout_max: 0.12
    encoder_dropout_min: 0.12
    encoder_dropout_max: 0.22
    classifier_dropout_min: 0.12
    classifier_dropout_max: 0.22
    label_smoothing_choices: [0.0]
    time_mask_count_choices: [0]
    time_mask_width_choices: [0]
    freq_mask_count_choices: [0]
    freq_mask_width_choices: [0]
  train:
    lr_min: 8.0e-5
    lr_max: 2.0e-4
    weight_decay_min: 1.0e-5
    weight_decay_max: 2.0e-4
    batch_choices: [8, 12]
  logmel:
    enabled: false
    n_mels_choices: [80]
    n_fft_choices: [1024]
    hop_length_choices: [160]
    normalize_choices: [true]
    f_min_choices: [0.0]
    f_max_choices: [6000.0]
