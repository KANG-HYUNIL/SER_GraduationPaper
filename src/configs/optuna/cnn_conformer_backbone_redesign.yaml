enabled: false
study_name: "${experiment.family}_optuna_backbone_redesign"
namespace_by_search_space: true
storage: "sqlite:///optuna_studies/${experiment.family}_optuna_backbone_redesign.db"
direction: "maximize"
trials: 30
timeout: null
sampler_seed: 42
pruner:
  warmup_steps: 0
parallel_workers: 1
trials_per_worker: 10
metric: "f1_macro"
visualization:
  save_html: true
  save_png: false
  png_scale: 3
trial_overrides:
  train:
    folds_to_run: 1
    loss:
      name: "cross_entropy"
      label_smoothing: 0.0
      class_weight_mode: "none"
      focal_gamma: 2.0
    sampler:
      name: "random"
      class_weight_mode: "none"
  model:
    embed_dim: 192
    num_layers: 4
    num_heads: 8
    ffn_dim: 768
    conv_kernel_size: 31
    conv_module_type: "single"
    pooling: "attention"
    layer_fusion: "last"
  data:
    n_mels: 80
    n_fft: 1024
    hop_length: 160
    normalize: true
    f_min: 0.0
    f_max: 6000.0
search_space:
  chunking:
    enabled: true
    chunk_frames_choices: [48]
    chunk_hop_ratio_choices: [0.25]
    eval_hop_ratio_choices: [0.25]
    aggregation_mode_choices: ["confidence_weighted_logit"]
    topk_ratio_choices: [0.75]
  cnn_conformer:
    backbone_variant_choices: ["lightstem", "nostem_patch", "band_token"]
    stem_pair_choices:
      - [64, 96]
    subsampling_choices:
      - name: "time_preserve_first"
        stem_strides: [[2, 1], [2, 2]]
    lightstem_channel_choices: [48, 64]
    lightstem_stride_choices:
      - name: "freq_only"
        stride: [2, 1]
      - name: "no_subsample"
        stride: [1, 1]
    nostem_patch_time_patch_choices: [2, 4]
    band_token_num_bands_choices: [2, 4]
    embed_dim_choices: [192]
    num_layers_choices: [4]
    num_heads_choices: [8]
    ffn_ratio_choices: [4]
    conv_kernel_choices: [31]
    layer_fusion_choices: ["last"]
    conv_module_type_choices: ["single"]
    loss_name_choices: ["cross_entropy"]
    sampler_name_choices: ["random"]
    class_weight_mode_choices: ["none"]
    focal_gamma_choices: [2.0]
    pooling_choices: ["attention"]
    stem_dropout_min: 0.08
    stem_dropout_max: 0.12
    projector_dropout_min: 0.08
    projector_dropout_max: 0.12
    input_dropout_min: 0.08
    input_dropout_max: 0.12
    encoder_dropout_min: 0.12
    encoder_dropout_max: 0.18
    classifier_dropout_min: 0.12
    classifier_dropout_max: 0.18
    label_smoothing_choices: [0.0]
    time_mask_count_choices: [0]
    time_mask_width_choices: [0]
    freq_mask_count_choices: [0]
    freq_mask_width_choices: [0]
  train:
    lr_min: 1.0e-4
    lr_max: 2.0e-4
    weight_decay_min: 1.0e-5
    weight_decay_max: 2.0e-4
    batch_choices: [8, 12]
  logmel:
    enabled: false
    n_mels_choices: [80]
    n_fft_choices: [1024]
    hop_length_choices: [160]
    normalize_choices: [true]
    f_min_choices: [0.0]
    f_max_choices: [6000.0]
