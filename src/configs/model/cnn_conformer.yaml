name: "cnn_conformer"
backbone_variant: "standard"
stem_channels: [32, 64]
stem_strides: [[2, 2], [2, 2]]
embed_dim: 192
num_heads: 4
num_layers: 8
ffn_dim: 768
conv_kernel_size: 31
conv_module_type: "single"
multiscale_kernel_sizes: [15, 31]
layer_fusion: "last"
pooling: "attention"
dropout: 0.1
stem_dropout: 0.1
projector_dropout: 0.1
input_dropout: 0.1
encoder_dropout: 0.1
classifier_dropout: 0.1
attention_type: "relative"
max_relative_position: 128
lightstem:
  channels: 64
  stride: [2, 1]
nostem_patch:
  time_patch: 4
band_token:
  num_bands: 4
  use_band_embedding: true
sequence_shrinking:
  enabled: false
  factor: 2
  at_layers: []
