defaults:
  - data: default
  - model: cnn_baseline
  - optuna: default
  - noise: default
  - cross_corpus: default
  - _self_

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${experiment.name}
  job:
    chdir: true

experiment:
  name: "${model.name}"
  family: "${model.name}"
  tag: ""

train:
  seed: 42
  batch_size: 32
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0
  label_smoothing: 0.0
  loss:
    name: "cross_entropy"
    label_smoothing: 0.0
    class_weight_mode: "none"
    focal_gamma: 2.0
  mixup:
    enabled: false
    alpha: 0.2
    level: "spectrogram"
  speaker_adversarial:
    enabled: false
    loss_weight: 0.1
    grl_lambda: 1.0
    hidden_dim: 128
    dropout: 0.1
  sampler:
    name: "random"
    class_weight_mode: "none"
  k_folds: 5
  folds_to_run: null
  early_stopping: 10
  device: "auto"
  num_workers: 0
  objective_metric: "f1_macro"
  save_best_to_root: true

inference:
  audio_path: ???
  model_checkpoint: ???
  output_dir: "inference_outputs"
