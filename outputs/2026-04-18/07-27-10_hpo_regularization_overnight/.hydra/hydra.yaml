hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${experiment.name}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - optuna=default
    - model=cnn_conformer
    - optuna.study_name=cnn_conformer_final_hpo
    - experiment.family=conformer_final_hpo
    - experiment.name=hpo_regularization_overnight
    - train.device=cuda
    - train.epochs=30
    - train.folds_to_run=1
    - optuna.trials=50
    - data.n_mels=80
    - data.n_fft=512
    - data.hop_length=160
    - data.f_min=0.0
    - data.f_max=8000.0
    - data.normalize=true
    - data.resize_enabled=false
    - model.attention_type=relative
    - model.max_relative_position=128
    - +optuna.search_space.logmel.enabled=false
    - optuna.search_space.cnn_conformer.embed_dim_choices=[256]
    - optuna.search_space.cnn_conformer.num_layers_choices=[4]
    - optuna.search_space.cnn_conformer.num_heads_choices=[8]
    - optuna.search_space.cnn_conformer.ffn_ratio_choices=[4]
    - optuna.search_space.cnn_conformer.conv_kernel_choices=[31]
    - optuna.search_space.cnn_conformer.pooling_choices=[attention]
    - optuna.search_space.cnn_conformer.stem_channel_choices=[64,96]
  job:
    name: optuna_search
    chdir: true
    override_dirname: +optuna.search_space.logmel.enabled=false,data.f_max=8000.0,data.f_min=0.0,data.hop_length=160,data.n_fft=512,data.n_mels=80,data.normalize=true,data.resize_enabled=false,experiment.family=conformer_final_hpo,experiment.name=hpo_regularization_overnight,model.attention_type=relative,model.max_relative_position=128,model=cnn_conformer,optuna.search_space.cnn_conformer.conv_kernel_choices=[31],optuna.search_space.cnn_conformer.embed_dim_choices=[256],optuna.search_space.cnn_conformer.ffn_ratio_choices=[4],optuna.search_space.cnn_conformer.num_heads_choices=[8],optuna.search_space.cnn_conformer.num_layers_choices=[4],optuna.search_space.cnn_conformer.pooling_choices=[attention],optuna.search_space.cnn_conformer.stem_channel_choices=[64,96],optuna.study_name=cnn_conformer_final_hpo,optuna.trials=50,optuna=default,train.device=cuda,train.epochs=30,train.folds_to_run=1
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: C:\Users\KANG\Desktop\BIT_Uni_record\GraudationPaper\SER_GraduationPaper
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: C:\Users\KANG\Desktop\BIT_Uni_record\GraudationPaper\SER_GraduationPaper\src\configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: C:\Users\KANG\Desktop\BIT_Uni_record\GraudationPaper\SER_GraduationPaper\outputs\2026-04-18\07-27-10_hpo_regularization_overnight
    choices:
      optuna: default
      model: cnn_conformer
      data: default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
