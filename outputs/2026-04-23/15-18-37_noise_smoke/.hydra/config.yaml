noise:
  eval:
    enabled: false
    resolved_config_path: outputs/2026-04-21/18-47-36_cnn_conformer/optuna_trials/trial_0003/resolved_config.yaml
    checkpoint_path: outputs/2026-04-21/18-47-36_cnn_conformer/weights/best_model_fold1.pt
    fold: 1
    batch_size: 16
    output_dir: noise_eval_smoke
    noise_types:
    - white
    snr_db:
    - clean
    - 20
    save_condition_artifacts: false
    max_artifact_conditions: 12
  generation:
    seed: 42
    babble_speakers: 4
    cafe_transient_count: 6
  train:
    enabled: false
    probability: 0.5
    noise_types:
    - white
    - pink
    - babble
    - cafe
    snr_db:
    - 20
    - 10
    - 5
    - 0
experiment:
  name: noise_smoke
  family: ${model.name}
  tag: ''
train:
  seed: 42
  batch_size: 32
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0
  label_smoothing: 0.0
  loss:
    name: cross_entropy
    label_smoothing: 0.0
    class_weight_mode: none
    focal_gamma: 2.0
  mixup:
    enabled: false
    alpha: 0.2
    level: spectrogram
  speaker_adversarial:
    enabled: false
    loss_weight: 0.1
    grl_lambda: 1.0
    hidden_dim: 128
    dropout: 0.1
  sampler:
    name: random
    class_weight_mode: none
  k_folds: 5
  folds_to_run: null
  early_stopping: 10
  device: auto
  num_workers: 0
  objective_metric: f1_macro
  save_best_to_root: true
inference:
  audio_path: ???
  model_checkpoint: ???
  output_dir: inference_outputs
