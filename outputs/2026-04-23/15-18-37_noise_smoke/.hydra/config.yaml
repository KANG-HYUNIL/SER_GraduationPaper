data:
  dataset_path: ${hydra:runtime.cwd}/src/$RVNS6MQ
  sample_rate: 16000
  duration: 3.0
  n_mels: 128
  n_fft: 1024
  hop_length: 512
  f_min: 0.0
  f_max: 8000.0
  normalize: true
  resize_enabled: true
  resize_height: 128
  resize_width: 512
  cache_features: true
  specaugment:
    enabled: false
    time_mask_count: 0
    time_mask_width: 0
    freq_mask_count: 0
    freq_mask_width: 0
  chunking:
    enabled: false
    chunk_frames: 64
    hop_frames: 32
    eval_hop_frames: 16
    aggregation_mode: mean_logit
    topk_ratio: 0.5
model:
  name: cnn_conformer
  backbone_variant: standard
  stem_channels:
  - 32
  - 64
  stem_strides:
  - - 2
    - 2
  - - 2
    - 2
  embed_dim: 192
  num_heads: 4
  num_layers: 8
  ffn_dim: 768
  layer_dim_schedule: []
  layer_ffn_schedule: []
  conv_kernel_size: 31
  conv_module_type: single
  multiscale_kernel_sizes:
  - 15
  - 31
  layer_fusion: last
  pooling: attention
  dropout: 0.1
  stem_dropout: 0.1
  projector_dropout: 0.1
  input_dropout: 0.1
  encoder_dropout: 0.1
  classifier_dropout: 0.1
  attention_type: relative
  max_relative_position: 128
  lightstem:
    channels: 64
    stride:
    - 2
    - 1
  nostem_patch:
    time_patch: 4
    norm_variant: layernorm
  band_token:
    num_bands: 4
    use_band_embedding: true
  sequence_shrinking:
    enabled: false
    factor: 2
    at_layers: []
optuna:
  enabled: false
  study_name: ${experiment.family}_optuna
  namespace_by_search_space: true
  storage: sqlite:///optuna_studies/${experiment.family}_optuna.db
  direction: maximize
  trials: 20
  timeout: null
  sampler_seed: 42
  pruner:
    warmup_steps: 0
  parallel_workers: 1
  trials_per_worker: 10
  metric: f1_macro
  visualization:
    save_html: true
    save_png: false
    png_scale: 3
  trial_overrides:
